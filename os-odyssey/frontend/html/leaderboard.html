<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://challenges.cloudflare.com https://os-odyssey-api.onrender.com https://cdn.jsdelivr.net; media-src 'self'; frame-src https://challenges.cloudflare.com; base-uri 'self'; form-action 'self' https://*.supabase.co; upgrade-insecure-requests" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <title>OS Odyssey - Leaderboard</title>
  <meta name="description" content="View the OS Odyssey learner leaderboard ranked by total XP or badges." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=Nunito:wght@400;600;700;800&display=swap"
    rel="stylesheet" />
  <link rel="icon" type="image/png" href="../../assets/favicon.png" />
  <link rel="stylesheet" href="../css/styles.css" />
</head>

<body class="app-page leaderboard-page">
  <nav class="app-nav">
    <a href="index.html" class="app-brand">
      <img class="brand-penguin" src="../../assets/penguin-flower-removebg-preview.png"
        alt="OS Odyssey penguin mascot" />
      OS ODYSSEY
    </a>
    <div class="app-nav-links">
      <a href="dashboard.html">Home</a>
      <a href="course.html">Learn</a>
      <a href="dashboard.html#practice">Practice</a>
      <a href="leaderboard.html" aria-current="page">Leaderboard</a>
      <a href="character-select.html" data-auth-action="user" hidden>Change Avatar</a>
      <button class="app-theme-toggle" type="button" id="dashThemeToggle" aria-label="Toggle dark/light mode">
        <span class="toggle-icon sun-icon">&#9728;</span>
        <span class="toggle-icon moon-icon">&#9790;</span>
      </button>
      <a href="login.html" data-auth-action="guest">Sign in</a>
      <button class="app-link-button" type="button" data-auth-action="user" data-logout hidden>Log out</button>
    </div>
  </nav>

  <main class="leaderboard-shell">
    <section class="leaderboard-hero">
      <img src="../../assets/7957f4cc59fbb19cdf57f1ea600429e6-removebg-preview.png" alt="" />
      <p class="section-kicker">SYSTEM RANKINGS</p>
      <h1>Leaderboard</h1>
    </section>

    <section class="leaderboard-panel" aria-labelledby="leaderboardTitle">
      <div class="leaderboard-panel-head">
        <div>
          <p class="section-kicker">TOP LEARNERS</p>
          <h2 id="leaderboardTitle">Ranked by Total XP</h2>
        </div>
        <div class="leaderboard-sort" aria-label="Choose leaderboard ranking">
          <button class="active" type="button" data-rank-mode="xp">XP</button>
          <button type="button" data-rank-mode="badges">Badges</button>
        </div>
      </div>

      <div class="leaderboard-table-head" aria-hidden="true">
        <span>Rank</span>
        <span>Learner</span>
        <span>Level</span>
        <span>Tier</span>
        <span id="leaderboardMetricHead">Total XP</span>
      </div>

      <div class="leaderboard-list" id="leaderboardList">
        <div class="leaderboard-state">Loading leaderboard...</div>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="../js/supabase.js"></script>
  <script src="../js/main.js"></script>
</body>

</html>
