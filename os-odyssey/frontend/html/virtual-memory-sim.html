<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://challenges.cloudflare.com https://os-odyssey-api.onrender.com https://cdn.jsdelivr.net; media-src 'self'; frame-src https://challenges.cloudflare.com; base-uri 'self'; form-action 'self' https://*.supabase.co; upgrade-insecure-requests" />
  <title>OS Odyssey - Virtual Memory Simulator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/png" href="../../assets/favicon.png" />
  <link rel="stylesheet" href="../css/styles.css" />
  <link rel="stylesheet" href="../css/sim.css" />
</head>

<body class="app-page dashboard-page" data-kernel-sim="virtual-memory">
  <nav class="app-nav"><a href="dashboard.html#system-lab" class="app-brand"><img class="brand-penguin" src="../../assets/penguin-flower-removebg-preview.png" alt="" />OS ODYSSEY</a><div class="app-nav-links"><a href="dashboard.html#system-lab">â† System Lab</a><button class="app-link-button" type="button" data-logout>Log out</button></div></nav>
  <main class="sim-shell">
    <div class="sim-header"><div class="sim-header-text"><p class="section-kicker">KERNEL MODE</p><h1>Virtual Memory Simulator</h1><p class="sim-subtitle">Step through replacement decisions while tracking page tables, frames, and a small TLB.</p></div><span class="sim-icon-ram" style="background:#0f766e;border-color:#5eead4;">VM</span></div>
    <section class="sim-controls">
      <div class="sim-control-row">
        <div class="sim-field sim-field-wide"><label for="vmRefs">Reference string</label><input id="vmRefs" value="7 0 1 2 0 3 0 4 2 3 0 3 2" /></div>
        <div class="sim-field"><label for="vmFrames">Frames</label><input type="number" id="vmFrames" value="3" min="1" max="5" /></div>
        <div class="sim-field"><label for="vmAlgo">Algorithm</label><select id="vmAlgo"><option value="fifo">FIFO</option><option value="lru">LRU</option><option value="optimal">Optimal</option></select></div>
        <button class="sim-btn sim-btn-run" type="button" id="vmRun">Run</button>
        <button class="sim-btn sim-btn-preset" type="button" id="vmStep">Next Step</button>
      </div>
    </section>
    <section class="sim-panel"><div class="sim-panel-header"><h2>Page Table & TLB</h2><div class="paging-stats"><span class="stat-chip fault">Faults: <strong id="vmFaults">0</strong></span><span class="stat-chip hit">Hits: <strong id="vmHits">0</strong></span></div></div><div class="kernel-viz" id="vmViz"></div><div class="sim-step-note" id="vmNote"><strong>Step:</strong> Run, then use Next Step to inspect each memory reference.</div></section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="../js/supabase.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/kernel-sims.js"></script>
</body>

</html>
