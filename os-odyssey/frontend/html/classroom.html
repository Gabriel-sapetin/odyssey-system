<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://challenges.cloudflare.com https://os-odyssey-api.onrender.com https://cdn.jsdelivr.net; media-src 'self'; frame-src https://challenges.cloudflare.com; base-uri 'self'; form-action 'self' https://*.supabase.co; upgrade-insecure-requests" />
  <title>OS Odyssey - My Classrooms</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/png" href="../../assets/favicon.png" />
  <link rel="stylesheet" href="../css/styles.css" />
  <link rel="stylesheet" href="../css/admin.css" />
</head>

<body class="app-page dashboard-page">
  <nav class="app-nav">
    <a href="index.html" class="app-brand">
      <img class="brand-penguin" src="../../assets/penguin-flower-removebg-preview.png" alt="OS Odyssey penguin mascot" />
      OS ODYSSEY
    </a>
    <button class="app-nav-mobile-toggle" type="button" aria-label="Toggle mobile menu">
      <span></span><span></span><span></span>
    </button>
    <div class="app-nav-links">
      <a href="dashboard.html">Dashboard</a>
      <a href="classroom.html" class="active">My Classes</a>
      <a href="course.html">Learn</a>
      <a href="leaderboard.html">Leaderboard</a>
      <button class="app-theme-toggle" type="button" id="dashThemeToggle" aria-label="Toggle dark/light mode">
        <span class="toggle-icon sun-icon">☀️</span>
        <span class="toggle-icon moon-icon">🌙</span>
      </button>
      <button class="app-link-button" type="button" data-logout>Log out</button>
    </div>
  </nav>

  <main class="admin-shell" id="classShell">
    <!-- Classroom List View -->
    <div id="studentClassList">
      <div class="admin-header">
        <h1>🎓 My Classrooms</h1>
      </div>

      <!-- Join classroom section -->
      <div style="margin-bottom:2rem">
        <p style="font-family:'Nunito',sans-serif;font-size:0.85rem;color:rgba(255,255,255,0.5);margin-bottom:0.5rem">Have a join code from your professor?</p>
        <div class="join-code-input-group">
          <input type="text" id="joinCodeInput" placeholder="ENTER CODE" maxlength="10" />
          <button class="admin-btn primary" id="joinClassBtn">Join</button>
        </div>
        <p class="join-feedback" id="joinFeedback" style="font-size:0.78rem;margin-top:0.4rem;font-family:'Nunito',sans-serif"></p>
      </div>

      <div class="classroom-grid" id="studentClassroomGrid"></div>
    </div>

    <!-- Classroom Detail View -->
    <div id="studentClassDetail" style="display:none">
      <div class="classroom-detail-header">
        <div>
          <button class="admin-btn" id="backToStudentClasses" style="margin-bottom:0.5rem">← Back</button>
          <h1 id="studentClassDetailName"></h1>
          <div style="margin-top:0.25rem;font-size:0.78rem;color:rgba(255,255,255,0.4)" id="studentClassDetailMeta"></div>
        </div>
        <button class="admin-btn danger" id="leaveClassBtn">Leave Classroom</button>
      </div>

      <!-- Inner tabs: Modules, Quizzes -->
      <div class="classroom-inner-tabs" id="studentInnerTabs">
        <button class="classroom-inner-tab active" data-stab="modules">📝 Lessons</button>
        <button class="classroom-inner-tab" data-stab="quizzes">📋 Quizzes</button>
      </div>

      <!-- Modules panel -->
      <div class="classroom-inner-panel active" id="student-modules">
        <div id="studentModulesList"></div>
      </div>

      <!-- Quizzes panel -->
      <div class="classroom-inner-panel" id="student-quizzes">
        <div id="studentQuizzesList"></div>
      </div>
    </div>

    <!-- Module Content View -->
    <div id="studentModuleView" style="display:none">
      <button class="admin-btn" id="backToClassModules" style="margin-bottom:1rem">← Back to Lessons</button>
      <h2 id="moduleViewTitle" style="font-family:'Nunito',sans-serif;font-weight:800;margin-bottom:1rem;color:#fff"></h2>
      <div id="moduleViewContent" style="font-family:'Nunito',sans-serif;font-size:0.9rem;color:rgba(255,255,255,0.8);line-height:1.7;white-space:pre-wrap"></div>
    </div>

    <!-- Quiz Taking View -->
    <div id="studentQuizView" style="display:none">
      <button class="admin-btn" id="backToClassQuizzes" style="margin-bottom:1rem">← Back to Quizzes</button>
      <h2 id="quizViewTitle" style="font-family:'Nunito',sans-serif;font-weight:800;margin-bottom:0.5rem;color:#fff"></h2>
      <p id="quizViewDesc" style="font-size:0.82rem;color:rgba(255,255,255,0.45);margin-bottom:1.5rem;font-family:'Nunito',sans-serif"></p>
      <div id="quizQuestionsContainer"></div>
      <div id="quizSubmitArea" style="margin-top:1.5rem;text-align:center">
        <button class="admin-btn primary" id="submitQuizBtn" style="padding:0.8rem 2rem;font-size:0.9rem">Submit Quiz</button>
      </div>
      <div id="quizResultArea" style="display:none"></div>
    </div>
  </main>

  <!-- Toast -->
  <div class="admin-toast" id="adminToast"></div>

  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="../js/supabase.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/classroom.js"></script>
</body>

</html>
