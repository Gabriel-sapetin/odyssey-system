<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <title>OS Odyssey — Sign Up</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=Nunito:wght@400;600;700;800&display=swap"
    rel="stylesheet" />
  <link rel="icon" type="image/png" href="../../assets/favicon.png" />
  <link rel="stylesheet" href="../css/styles.css" />
</head>

<body class="auth-page">

  <!-- ===== NAVBAR ===== -->
  <nav class="navbar">
    <a href="index.html" class="nav-logo">
      <img class="brand-penguin" src="../../assets/penguin-flower-removebg-preview.png" alt="OS Odyssey penguin mascot" />
      OS ODYSSEY
    </a>
    <div class="nav-right">
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
        <span class="sun">☀️</span>
        <span class="moon">🌙</span>
      </button>
    </div>
  </nav>

  <!-- ===== AUTH SECTION =====
    ASSETS USED:
    - Light mode: ../../assets/hero-bg-day.jpg   (full page background)
    - Dark mode:  ../../assets/hero-bg-night.jpg (swapped via CSS [data-theme=dark])
    - ../../assets/penguin-flower.png            (mascot above form card)
  -->
  <section class="auth-section">

    <div class="auth-card">
      <a href="index.html" class="auth-back" aria-label="Back to home">← Back</a>
      <!-- penguin-flower.png: pixel art penguin holding a pink daisy, transparent bg -->
      <div class="auth-penguin">
        <img src="../../assets/penguin-flower-removebg-preview.png" alt="OS Odyssey penguin" />
      </div>
      <p class="auth-headline">Create an account to save your progress :)</p>

      <button class="btn btn-google" id="googleSignupBtn">
        <img src="https://www.svgrepo.com/show/475656/google-color.svg" width="20" alt="Google" />
        Continue with Google
      </button>

      <div class="auth-divider"><span>OR</span></div>

      <div class="auth-form">
        <input type="email" class="auth-input" placeholder="Email" autocomplete="email" />
        <input type="password" class="auth-input" placeholder="Password" autocomplete="new-password" />
        <label class="auth-terms-check">
          <input type="checkbox" id="termsAccepted" />
          <span>
            I have read and accept the
            <a href="terms.html">OS Odyssey Terms of Use</a>.
          </span>
        </label>
        <button class="btn btn-cta auth-submit" data-auth-mode="signup" data-loading-text="Creating account..." data-redirect="character-select.html" type="submit">Sign up for free</button>
        <p class="auth-login">
          Already have an account? <a href="login.html">Log in</a>
        </p>
      </div>
    </div>

  </section>

  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="../js/supabase.js"></script>
  <script src="../js/main.js"></script>
</body>

</html>
