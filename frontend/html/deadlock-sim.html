<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://challenges.cloudflare.com https://os-odyssey-api.onrender.com https://cdn.jsdelivr.net; media-src 'self'; frame-src https://challenges.cloudflare.com; base-uri 'self'; form-action 'self' https://*.supabase.co; upgrade-insecure-requests" />
  <title>OS Odyssey - Deadlock Simulator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/png" href="../../assets/favicon.png" />
  <link rel="stylesheet" href="../css/styles.css" />
  <link rel="stylesheet" href="../css/sim.css" />
</head>

<body class="app-page dashboard-page" data-kernel-sim="deadlock">
  <nav class="app-nav">
    <a href="dashboard.html#system-lab" class="app-brand"><img class="brand-penguin" src="../../assets/penguin-flower-removebg-preview.png" alt="" />OS ODYSSEY</a>
    <div class="app-nav-links"><a href="dashboard.html#system-lab">&larr; System Lab</a><button class="app-link-button" type="button" data-logout>Log out</button></div>
  </nav>
  <main class="sim-shell">
    <div class="sim-header">
      <div class="sim-header-text"><p class="section-kicker">KERNEL MODE</p><h1>Deadlock Simulator</h1><p class="sim-subtitle">Build a resource-allocation cycle, detect deadlock, and run a Banker's Algorithm safety check.</p></div>
      <span class="sim-icon-cpu" style="background:#b91c1c;border-color:#fca5a5;">DL</span>
    </div>
    <section class="sim-controls">
      <div class="sim-control-row">
        <button class="sim-btn sim-btn-preset" type="button" id="dlSafe">Load Safe State</button>
        <button class="sim-btn sim-btn-reset" type="button" id="dlDeadlock">Load Deadlock</button>
        <button class="sim-btn sim-btn-run" type="button" id="dlDetect">Detect</button>
        <button class="sim-btn sim-btn-add" type="button" id="dlBanker">Banker's Check</button>
      </div>
    </section>
    <section class="sim-panel">
      <div class="kernel-grid">
        <div><h2>Resources</h2><div class="kernel-list" id="dlList"></div></div>
        <div><h2>Resource Allocation Graph</h2><div class="kernel-viz" id="dlViz"></div><div class="sim-step-note" id="dlNote"><strong>Step:</strong> Load a scenario, then detect cycles.</div></div>
      </div>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="../js/supabase.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/kernel-sims.js"></script>
</body>

</html>
